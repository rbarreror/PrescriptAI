# apps/ml_engine/pyproject.toml

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prescriptai-ml"
version = "0.1.0"
description = "Machine learning engine for probabilistic demand forecasting and inventory optimization."
requires-python = ">=3.11"
authors = [
    { name = "Rafael Barrero Rodríguez" }
]

# Core runtime dependencies for the ML engine
dependencies = [
    "lightgbm>=4.3.0",
    "pandas>=2.2.0",
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "mlforecast>=0.13.0",
    "tqdm>=4.66.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0"
]

[project.optional-dependencies]
# Dependencies needed only for development and testing
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "ipykernel>=6.29.0"
]

# Instructs setuptools to look for packages inside the 'src' directory
[tool.setuptools.packages.find]
where = ["src"]

# Ruff linter and formatter configuration (optional but highly recommended)
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"] # Enable Pyflakes (F), pycodestyle (E), and isort (I)