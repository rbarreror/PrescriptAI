# docker-compose.yml
services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: prescriptai_db_container
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - prescriptai_network
    volumes:
      # Named volume for persistent database storage
      - postgres_data:/var/lib/postgresql/data
      # Bind mount for database initialization script
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

# Contenedor de desarrollo para el motor de Machine Learning
  ml_engine:
    build:
      context: .
      dockerfile: .devcontainer/ml_engine/Dockerfile
      target: development
    volumes:
      # Montaje de todo el repositorio en el espacio de trabajo del contenedor
      - .:/workspaces/prescriptai:cached
    ipc: host  # Evita errores de memoria compartida al procesar matrices y entrenar árboles
    networks:
      - prescriptai_network
    depends_on:
      - postgres
    command: sleep infinity

networks:
  prescriptai_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local